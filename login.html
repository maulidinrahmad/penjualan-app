<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - AppPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-8 rounded-3xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-indigo-600 text-white font-bold text-2xl rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">A</div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Login Admin</h1>
            <p class="text-xs text-slate-400">Masuk untuk mengelola pesanan & grafik penjualan</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Admin</label>
                <input type="email" id="email" required placeholder="admin@domain.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30">
                Masuk ke Dashboard
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Ganti konfigurasi di bawah dengan Firebase Config milik Anda
        const firebaseConfig = {
        apiKey: "AIzaSyA_mp6j-ncOLl2HoqzSud4sttnnBhLKGiE",
        authDomain: "appstore-web-74576.firebaseapp.com",
        projectId: "appstore-web-74576",
        storageBucket: "appstore-web-74576.firebasestorage.app",
        messagingSenderId: "16888091928",
        appId: "1:16888091928:web:00f478821cada02a357a6d",
        measurementId: "G-KMXHPGGQH5"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = "Memverifikasi...";

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Login gagal: Email atau Password salah.");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = "Masuk ke Dashboard";
            }
        });
    </script>
</body>
</html>
